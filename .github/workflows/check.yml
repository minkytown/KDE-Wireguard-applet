name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y jq socat ripgrep gawk xdg-dbus-proxy dbus dnsmasq iproute2 nftables wireguard-tools
      - run: bash tests/run.sh
